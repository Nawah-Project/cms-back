name: Hosted CI and release candidate
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      ops: ${{ steps.plan.outputs.ops }}
      images: ${{ steps.plan.outputs.images }}
      schema: ${{ steps.plan.outputs.schema }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
    - name: Check conservative path classification
      run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
    - name: Plan only the required work
      id: plan
      run: python3 scripts/ci/plan.py --profile nawah-back
  ops:
    needs: plan
    if: needs.plan.outputs.ops == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24.22.2
    - run: python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v
    - name: Provide the PostgreSQL image needed by isolated backup tests
      run: docker pull postgres:17-alpine
    - run: python3 scripts/backup/test_backup.py
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cms_ci
          POSTGRES_PASSWORD: ci_only_ephemeral
          POSTGRES_DB: cms_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U cms_ci -d cms_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cms_ci:ci_only_ephemeral@127.0.0.1:5432/cms_test
      TEST_DATABASE_URL: postgresql://cms_ci:ci_only_ephemeral@127.0.0.1:5432/cms_test
      JWT_ACCESS_SECRET: ephemeral_ci_access_secret_not_production_123456
      JWT_REFRESH_SECRET: ephemeral_ci_refresh_secret_not_production_123456
      FRONTEND_ORIGIN: http://127.0.0.1:5174
      UX_CONFIG_FILE: /tmp/nawah-ci-ux-config.json
      CV_STORAGE_DIR: /tmp/nawah-ci-private-storage
      LEARNING_STORAGE_DIR: /tmp/nawah-ci-learning-storage
      LEARNING_INBOX_DIR: /tmp/nawah-ci-learning-inbox
      COOKIE_SECURE: 'false'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24.22.2
        cache: npm
    - run: npm ci --include=optional
    - run: npm run prisma:generate
    - name: Compile the artifact used by integration tests and the image
      run: npm run build
    - run: node scripts/architecture/check-boundaries.cjs
    - run: npm audit --omit=dev --audit-level=high
    - run: npm test -- --runInBand
    - run: npm run prisma:migrate:test
    - run: npm run test:e2e
    - name: Pass the tested compiled output to Docker without rebuilding it
      if: needs.plan.outputs.images == 'true'
      run: |-
        mkdir -p /tmp/ci-compiled
        cp -a dist /tmp/ci-compiled/dist
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      if: needs.plan.outputs.images == 'true'
    - name: Build standalone production image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        load: true
        platforms: linux/amd64
        tags: nawah/api:sha-${{ github.sha }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha,scope=api
        cache-to: type=gha,mode=max,scope=api
        target: runtime-ci
        build-contexts: compiled=/tmp/ci-compiled
      if: needs.plan.outputs.images == 'true'
    - name: Smoke test actual runtime with disposable CI state
      env:
        IMAGE: nawah/api:sha-${{ github.sha }}
      run: |
        docker run -d --name ci-runtime -e METRICS_TOKEN=ephemeral_ci_metrics_only --network host -e NODE_ENV=production -e PORT=13000 -e DATABASE_URL -e JWT_ACCESS_SECRET -e JWT_REFRESH_SECRET -e FRONTEND_ORIGIN=https://ci.example.com -e COOKIE_SECURE=true "$IMAGE"
        for attempt in $(seq 1 50); do
          if curl --fail --silent http://127.0.0.1:13000/health >/dev/null; then exit 0; fi
          sleep 2
        done
        docker logs ci-runtime
        exit 1
      if: needs.plan.outputs.images == 'true'
    - name: Verify actual runtime dependencies and request handling
      env:
        IMAGE: nawah/api:sha-${{ github.sha }}
      run: docker run --rm --network none --entrypoint node -v "$PWD/scripts/security:/checks:ro" "$IMAGE" --test /checks/runtime-checks.cjs
      if: needs.plan.outputs.images == 'true'
    - name: Package tested image
      if: needs.plan.outputs.images == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
      env:
        IMAGE: nawah/api:sha-${{ github.sha }}
      run: python3 scripts/deployment/release.py prepare --component api --image "$IMAGE"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: needs.plan.outputs.images == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
      with:
        name: candidate-${{ github.sha }}
        path: candidate/
        overwrite: true
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
    - name: Remove disposable CI container
      if: needs.plan.outputs.images == 'true' && (always())
      run: docker rm -f ci-runtime || true
    needs:
    - plan
    - ops
    if: always() && needs.plan.outputs.code == 'true' && (needs.ops.result == 'success' || needs.ops.result == 'skipped')
    permissions:
      contents: read
    concurrency:
      group: checks-${{ github.ref }}-${{ needs.plan.outputs.images }}
      cancel-in-progress: true
  publish:
    if: needs.plan.outputs.images == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
    - plan
    - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: candidate-${{ github.sha }}
        path: candidate
    - name: Publish unapproved candidate without rebuilding
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/deployment/release.py publish
  ci-gate:
    needs:
    - plan
    - ops
    - verify
    - publish
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Require every selected stage to pass
      env:
        CI_NEEDS: ${{ toJSON(needs) }}
      run: |-
        python3 - <<'PY'
        import json,os
        r=json.loads(os.environ['CI_NEEDS'])
        assert r['plan']['result']=='success', 'Delivery planning failed'
        assert all(v['result'] in ['success','skipped'] for v in r.values()), 'A required stage failed or was cancelled'
        print('Selected delivery checks passed; skipped stages were not needed.')
        PY
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch:
    inputs:
      full_build:
        description: Force all checks and image builds (PRs normally compile/test without packaging)
        type: boolean
        required: false
        default: false
