name: Hosted CI and release candidate
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cms_ci
          POSTGRES_PASSWORD: ci_only_ephemeral
          POSTGRES_DB: cms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms_ci -d cms_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cms_ci:ci_only_ephemeral@127.0.0.1:5432/cms_test
      TEST_DATABASE_URL: postgresql://cms_ci:ci_only_ephemeral@127.0.0.1:5432/cms_test
      JWT_ACCESS_SECRET: ephemeral_ci_access_secret_not_production_123456
      JWT_REFRESH_SECRET: ephemeral_ci_refresh_secret_not_production_123456
      FRONTEND_ORIGIN: http://127.0.0.1:5174
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run prisma:generate
      - run: npm test -- --runInBand
      - run: npm run prisma:migrate:test
      - run: npm run test:e2e
      - run: python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build standalone production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: nawah/api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Smoke test actual runtime with disposable CI state
        env:
          IMAGE: nawah/api:sha-${{ github.sha }}
        run: |
          docker run -d --name ci-runtime --network host -e NODE_ENV=production -e PORT=13000 -e DATABASE_URL -e JWT_ACCESS_SECRET -e JWT_REFRESH_SECRET -e FRONTEND_ORIGIN -e COOKIE_SECURE "$IMAGE"
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:13000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs ci-runtime
          exit 1
      - name: Package tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: nawah/api:sha-${{ github.sha }}
        run: python3 scripts/deployment/release.py prepare --component api --image "$IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: candidate-${{ github.sha }}
          path: candidate/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove disposable CI container
        if: always()
        run: docker rm -f ci-runtime || true
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-${{ github.sha }}
          path: candidate
      - name: Publish unapproved candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deployment/release.py publish
