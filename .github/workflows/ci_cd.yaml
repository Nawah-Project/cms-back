name: CI and production deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: cms-back-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and smoke test development stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate development Compose file
        run: docker compose -f compose.dev.yml config --quiet

      - name: Start isolated development stack
        run: docker compose -f compose.dev.yml up -d --build

      - name: Wait for API and database health
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.dev.yml logs api postgres
          exit 1

      - name: Stop CI stack
        if: always()
        run: docker compose -f compose.dev.yml down --remove-orphans

  deploy-production:
    name: Deploy API to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: cms-back-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check production runner access
        run: |
          test -w /data/cms-back
          docker compose version
          rsync --version

      - name: Sync backend source and deploy API only
        run: |
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.git/' \
            --exclude='/node_modules/' \
            --exclude='/dist/' \
            --exclude='/private-storage/' \
            --exclude='/coverage/' \
            ./ /data/cms-back/
          docker compose -f /data/cms-back/compose.yml up -d --build api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose -f /data/cms-back/compose.yml logs --tail=60 api
          exit 1
