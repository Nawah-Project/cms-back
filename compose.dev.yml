name: cms-development-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:?Set DEV_POSTGRES_USER in development .env}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD in development .env}
      POSTGRES_DB: ${DEV_POSTGRES_DB:?Set DEV_POSTGRES_DB in development .env}
    volumes:
      - cms-development-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${DEV_POSTGRES_USER:?Set DEV_POSTGRES_USER in development .env}:${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD in development .env}@postgres:5432/${DEV_POSTGRES_DB:?Set DEV_POSTGRES_DB in development .env}?schema=public
      JWT_ACCESS_SECRET: ${DEV_JWT_ACCESS_SECRET:?Set DEV_JWT_ACCESS_SECRET in development .env}
      JWT_REFRESH_SECRET: ${DEV_JWT_REFRESH_SECRET:?Set DEV_JWT_REFRESH_SECRET in development .env}
      FRONTEND_ORIGIN: ${DEV_FRONTEND_ORIGIN:?Set DEV_FRONTEND_ORIGIN in development .env}
      AUTH_COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
      TRUST_PROXY: "0"
      ACCESS_TOKEN_TTL_SECONDS: ${DEV_ACCESS_TOKEN_TTL_SECONDS:-1200}
      REFRESH_TOKEN_TTL_SECONDS: ${DEV_REFRESH_TOKEN_TTL_SECONDS:-1209600}
      CV_STORAGE_DIR: /app/private-storage/cvs
      CV_MAX_FILE_SIZE_BYTES: ${DEV_CV_MAX_FILE_SIZE_BYTES:-5242880}
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_API_HOST_PORT:?Set DEV_API_HOST_PORT in development .env}:3000"
    volumes:
      - cms-development-cv-storage:/app/private-storage/cvs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 30s
    mem_limit: 1g

volumes:
  cms-development-postgres-data:
  cms-development-cv-storage:
