name: cms-back-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cms_dev
      POSTGRES_PASSWORD: cms_dev_local_only
      POSTGRES_DB: cms_dev
    ports:
      - "127.0.0.1:${DEV_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - cms-back-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ["sh", "-c", "npm run prisma:migrate:deploy && npm run start:dev"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DEV_DATABASE_URL:-postgresql://cms_dev:cms_dev_local_only@postgres:5432/cms_dev?schema=public}
      JWT_ACCESS_SECRET: ${DEV_JWT_ACCESS_SECRET:-local-development-only-access-secret}
      JWT_REFRESH_SECRET: ${DEV_JWT_REFRESH_SECRET:-local-development-only-refresh-secret}
      FRONTEND_ORIGIN: ${DEV_FRONTEND_ORIGIN:-http://localhost:5173}
      AUTH_COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
      TRUST_PROXY: "0"
      ACCESS_TOKEN_TTL_SECONDS: ${DEV_ACCESS_TOKEN_TTL_SECONDS:-1200}
      REFRESH_TOKEN_TTL_SECONDS: ${DEV_REFRESH_TOKEN_TTL_SECONDS:-1209600}
      CV_STORAGE_DIR: /app/private-storage/cvs
      CV_MAX_FILE_SIZE_BYTES: ${DEV_CV_MAX_FILE_SIZE_BYTES:-5242880}
    ports:
      - "127.0.0.1:${DEV_BACKEND_HOST_PORT:-3001}:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - cms-back-dev-cv-storage:/app/private-storage/cvs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 30s

volumes:
  cms-back-dev-postgres-data:
  cms-back-dev-cv-storage:
