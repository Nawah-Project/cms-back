services:
  postgres:
    image: postgres:17-alpine
    container_name: cms-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_local_dev_password
      POSTGRES_DB: cms
    ports:
      - "5432:5432"
    volumes:
      - cms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cms-postgres-data:
